<div class="club">
  <div class="club-logo">🏏</div>

  <div>
    <div class="club-name">ASHTEAD</div>
    <div class="club-sub">CRICKET CLUB</div>
  </div>
</div>

<div class="title-block">
  <h1>SATURDAY MATCH CENTRE</h1>
  <p>LIVE SCORES FROM AROUND THE CLUB</p>
</div>

<div class="clock-panel">
  <div id="date"></div>
  <div id="clock"></div>
</div>
<section class="featured">

  <div class="live-badge">LIVE</div>

  <div class="featured-header">
    <h2 id="featuredTitle"></h2>
  </div>

  <div class="stream-placeholder">
    <iframe
      id="youtubeFrame"
      width="100%"
      height="100%"
      frameborder="0"
      allowfullscreen>
    </iframe>
  </div>

  <div class="featured-score">
    <span id="featuredScore"></span>
  </div>

  <div class="featured-overs" id="featuredOvers"></div>

</section>

<aside class="right-column">

  <div class="match-card">
    <h3 id="secondTitle"></h3>
    <div class="small-score" id="secondScore"></div>
    <p id="secondStatus"></p>
  </div>

  <div class="match-card">
    <h3 id="thirdTitle"></h3>
    <div class="small-score" id="thirdScore"></div>
    <p id="thirdStatus"></p>
  </div>

  <div class="match-card">
    <h3 id="fourthTitle"></h3>
    <div class="small-score" id="fourthScore"></div>
    <p id="fourthStatus"></p>
  </div>

</aside>
<div class="sponsor-panel">
  <h2>SPONSOR MESSAGE</h2>
  <p id="sponsorMessage"></p>
</div>

<div class="announcement-panel">
  <h2>CLUB ANNOUNCEMENT</h2>
  <p id="clubAnnouncement"></p>
</div>
