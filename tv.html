<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ashtead Match Centre</title>
<link rel="stylesheet" href="styles.css">
</head>

<body>

<div id="app" class="tv-container">

  <header class="top-bar">

    <div class="club-block">
      <img src="images/crest.png" class="crest" alt="Ashtead CC">
      <div>
        <div class="club-name">ASHTEAD</div>
        <div class="club-subtitle">CRICKET CLUB</div>
      </div>
    </div>

    <div class="title-block">
      <h1>SATURDAY MATCH CENTRE</h1>
      <div class="subtitle">LIVE SCORES FROM AROUND THE CLUB</div>
    </div>

    <div class="clock-block">
      <div id="date"></div>
      <div id="clock"></div>
    </div>

  </header>

  <section class="main-content">

    <section class="featured-match">

      <div class="live-banner">
        LIVE
      </div>

      <h2 id="featuredTitle"></h2>

      <div id="videoContainer" class="video-container">

        <img
          src="images/default-ground.jpeg"
          class="ground-image"
          id="groundImage"
        >

        <iframe
          id="youtubeFrame"
          class="youtube-frame"
          allowfullscreen>
        </iframe>

      </div>

      <div class="featured-score-row">

        <div>
          <div id="featuredScore" class="featured-score"></div>
          <div id="featuredOvers" class="featured-overs"></div>
        </div>

      </div>

    </section>

    <aside class="side-panel">

      <div class="match-card">
        <div class="team-label">2ND XI</div>
        <h3 id="match2Title"></h3>
        <div id="match2Score" class="card-score"></div>
        <div id="match2Status" class="card-status"></div>
      </div>

      <div class="match-card">
        <div class="team-label">3RD XI</div>
        <h3 id="match3Title"></h3>
        <div id="match3Score" class="card-score"></div>
        <div id="match3Status" class="card-status"></div>
      </div>

      <div class="match-card">
        <div class="team-label">4TH XI</div>
        <h3 id="match4Title"></h3>
        <div id="match4Score" class="card-score"></div>
        <div id="match4Status" class="card-status"></div>
      </div>

    </aside>

  </section>

  <section class="bottom-row">

    <div class="sponsor-box">
      <h3>CLUB SPONSOR</h3>
      <img id="sponsorImage" class="sponsor-image">
    </div>

    <div class="announcement-box">
      <h3>CLUB NEWS</h3>
      <div id="announcementText"></div>
    </div>

  </section>

  <footer class="footer-bar">
    Ashtead CC Match Centre
  </footer>

</div>

<script src="tv.js"></script>

</body>
</html>
